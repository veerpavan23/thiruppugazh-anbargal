<!DOCTYPE html>
<html>
<head>
  <title>Update Contacts</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Update Firestore Contacts</h2>
  <button id="runBtn" style="padding: 10px 20px; font-size: 16px;">Run Update</button>
  <div id="log" style="margin-top: 20px; font-family: monospace;"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBZj1DcjriYkzGsu6su5mgVdzFD0yC4-r8",
      authDomain: "thiruppugazhanbargal-515e8.firebaseapp.com",
      projectId: "thiruppugazhanbargal-515e8",
      storageBucket: "thiruppugazhanbargal-515e8.appspot.com",
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    document.getElementById('runBtn').addEventListener('click', async () => {
      const logEl = document.getElementById('log');
      const log = (msg) => logEl.innerHTML += `<div>${msg}</div>`;
      
      log("Starting update...");
      
      const updates = [
        { oldNum: "9448089383", newName: "Sri Santhanam", newNum: "9900541239" },
        { oldNum: "9967664594", newName: "Smt Usha Gopalan", newNum: "8333959217" },
        { oldNum: "9962905136", newName: "Smt Uma Balasubramanian", newNum: "9884054757" },
        { oldNum: "9395528128", newName: "Smt Usha Shankaran", newNum: "8333959217" }
      ];

      for (let u of updates) {
        try {
          const snapshot = await db.collection("phoneNumbers").where("number", "==", u.oldNum).get();
          if (snapshot.empty) {
            log(`<span style="color:red">Could not find contact with number: ${u.oldNum}</span>`);
          } else {
            for (let doc of snapshot.docs) {
              await doc.ref.update({
                name: u.newName,
                number: u.newNum
              });
              log(`<span style="color:green">Updated contact ${u.oldNum} to ${u.newName} - ${u.newNum}</span>`);
            }
          }
        } catch (e) {
          log(`<span style="color:red">Error updating ${u.oldNum}: ${e.message}</span>`);
        }
      }
      log("<strong>Done! You can close this page.</strong>");
    });
  </script>
</body>
</html>
