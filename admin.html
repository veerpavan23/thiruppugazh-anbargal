<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Thiruppugazh Anbargal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/admin.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  
  <main class="container">
    <div class="admin-container">
      <h1 class="text-center" style="margin-bottom: 2rem;">Admin Dashboard</h1>
      
      <!-- Auth Guard Redirect -->
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const auth = window.auth || firebase.auth();
          auth.onAuthStateChanged(user => {
            if (!user) {
              window.location.href = 'login.html';
            }
          });
        });
      </script>

      <!-- Dashboard View -->
      <div id="admin-dashboard" style="display: block;">
        <!-- Title and Logout -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2 id="dashboard-header">Admin Dashboard</h2>
          <button id="logout-btn" class="btn btn-secondary btn-small">Sign Out</button>
        </div>

        <div class="admin-tabs" style="display: flex; gap: 1rem; border-bottom: 2px solid #eee; margin-bottom: 2rem; padding-bottom: 0.5rem;">
          <button id="tab-events" class="btn active" style="background: var(--primary-color); color: white;" onclick="switchAdminTab('events')">Manage Events</button>
          <button id="tab-users" class="btn btn-secondary" onclick="switchAdminTab('users')">Manage Users</button>
        </div>

        <div id="manage-events" class="admin-tab-content" style="display: block;">
          <div id="event-form-container" style="display: none;">
            <h3 id="form-title">Create New Event</h3>
            <form id="event-form">
              <input type="hidden" id="event-id">
              <div class="grid grid-2">
                <div class="form-group">
                  <label for="eventName">Event Name *</label>
                  <input type="text" id="eventName" class="form-control" required>
                </div>
                <div class="form-group">
                  <label for="eventDateTime">Date & Time *</label>
                  <input type="datetime-local" id="eventDateTime" class="form-control" required>
                </div>
              </div>
              
              <div class="form-group">
                <label for="city">City *</label>
                <input type="text" id="city" class="form-control" required>
              </div>
              
              <div class="form-group">
                <label for="venue">Venue *</label>
                <textarea id="venue" class="form-control" required></textarea>
              </div>

              <div class="form-group">
                <label for="bhajan">Bhajan</label>
                <input type="text" id="bhajan" class="form-control">
              </div>

              <div class="grid grid-2">
                <div class="form-group">
                  <label for="urlToJoin">URL To Join (Valid URL)</label>
                  <input type="url" id="urlToJoin" class="form-control" placeholder="https://...">
                </div>
                <div class="form-group">
                  <label for="mediaUrl">Photos & Videos (Valid URL)</label>
                  <input type="url" id="mediaUrl" class="form-control" placeholder="https://...">
                </div>
              </div>
              
              <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn">Save Event</button>
                <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
              </div>
            </form>
          </div>

          <button id="add-event-btn" class="btn" style="margin-bottom: 2rem;">+ Add New Event</button>
          
          <div id="events-list" class="event-list">
            <p class="text-center">Loading events...</p>
          </div>
          </div>
        </div>

        <!-- Manage Users Section -->
        <div id="manage-users" class="admin-tab-content" style="display: none;">
          <div id="user-form-container" style="display: none; margin-bottom: 2rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px;">
            <h3 id="user-form-title">Create New User</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 1rem;">This will create the user account and send them an email to set their password.</p>
            <form id="user-form">
              <input type="hidden" id="user-doc-id">
              <div class="grid grid-2">
                <div class="form-group">
                  <label for="userName">Name *</label>
                  <input type="text" id="userName" class="form-control" required>
                </div>
                <div class="form-group">
                  <label for="userEmail">Email Address *</label>
                  <input type="email" id="userEmail" class="form-control" required>
                </div>
              </div>
              <div class="grid grid-2" style="margin-bottom: 1rem;">
                <div class="form-group">
                  <label for="userRole">Role *</label>
                  <select id="userRole" class="form-control" required>
                    <option value="Admin">Admin</option>
                    <option value="Editor">Editor</option>
                    <option value="Viewer">Viewer</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="userStatus">Account Status *</label>
                  <select id="userStatus" class="form-control" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; gap: 1rem;">
                <button type="submit" id="save-user-btn" class="btn">Create User</button>
                <button type="button" class="btn btn-secondary" onclick="cancelUserEdit()">Cancel</button>
              </div>
            </form>
          </div>

          <button id="add-user-btn" class="btn" style="margin-bottom: 2rem;" onclick="showAddUserForm()">+ Add New User</button>
          
          <div id="users-list" class="event-list">
            <p class="text-center">Loading users...</p>
          </div>
        </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
