<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Thiruppugazh Anbargal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <main class="container">
    <div class="admin-container" style="max-width: 400px; margin: 4rem auto;">
      <h1 class="text-center" style="margin-bottom: 2rem;">Administrator Sign In</h1>
      
      <div id="auth-view" class="auth-form">
        <div id="auth-error" style="color: red; margin-bottom: 1rem; text-align:center; display: none;"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="admin@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <div style="text-align: right; margin-bottom: 1rem;">
            <a href="#" id="forgot-password-link" style="font-size: 0.85rem; color: var(--primary-color);">Forgot Password?</a>
          </div>
          <button type="submit" id="login-btn" class="btn" style="width: 100%;">Sign In</button>
        </form>
      </div>
      
      <p class="text-center mt-2">
        <a href="index.html" style="color: var(--text-muted); font-size: 0.9rem;">← Back to Public Website</a>
      </p>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const auth = window.auth || firebase.auth();
      const loginForm = document.getElementById('login-form');
      const authError = document.getElementById('auth-error');
      const loginBtn = document.getElementById('login-btn');

      // If user is already logged in, redirect to admin.html
      auth.onAuthStateChanged(user => {
        if (user) {
          window.location.href = 'admin.html';
        }
      });

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing In...';
        authError.style.display = 'none';

        try {
          await auth.signInWithEmailAndPassword(email, password);
          
          // Verify access control
          const db = firebase.firestore();
          const userDocs = await db.collection("users").where("email", "==", email).get();
          if (userDocs.empty) {
            if (email === 'veer.pavan@gmail.com' || email === 'girijaakrish@gmail.com') {
              await db.collection("users").add({
                name: email.split('@')[0],
                email: email,
                role: "Super Admin",
                status: "Active",
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              // Proceed to login
            } else {
              await auth.signOut();
              throw new Error("Your account has been removed from the dashboard.");
            }
          } else {
            const userData = userDocs.docs[0].data();
            if (userData.status === 'Inactive') {
              await auth.signOut();
              throw new Error("Your account has been deactivated by the administrator.");
            }
          }
          
          // Redirect on successful login (onAuthStateChanged will handle it)
        } catch (error) {
          authError.style.color = 'red';
          authError.textContent = error.message || "Invalid username or password. Please try again.";
          authError.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      });

      const forgotPasswordLink = document.getElementById('forgot-password-link');
      forgotPasswordLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        if (!email) {
          authError.style.color = 'red';
          authError.textContent = "Please enter your email address in the field above first.";
          authError.style.display = 'block';
          return;
        }
        
        try {
          const actionCodeSettings = {
            url: window.location.origin + '/login.html',
            handleCodeInApp: false
          };
          await auth.sendPasswordResetEmail(email, actionCodeSettings);
          authError.style.color = 'green';
          authError.textContent = "Password reset email sent! Check your inbox.";
          authError.style.display = 'block';
        } catch (error) {
          authError.style.color = 'red';
          authError.textContent = "Error sending reset email: " + error.message;
          authError.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
